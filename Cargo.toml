[workspace]
members = ["gui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Zuygui <maxime@halbitte.fr>"]
license = "MIT"
repository = "https://github.com/zuygui/goat-hooker"
homepage = "https://github.com/zuygui/goat-hooker"

# Binaires plus légers pour les releases
[profile.release]
strip = true
lto = "thin"

[package]
name = "goat-hooker"
description = "An open-source Git hooks manager, with mono-repos support"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["git", "hooks", "pre-commit", "monorepo", "cli"]
categories = ["command-line-utilities", "development-tools"]
include = ["src/**", "schema.json", "README.md", "LICENSE"]

[lib]
name = "goat_hooker"
path = "src/lib.rs"

[[bin]]
name = "hooker"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
colored = "3"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0.143", features = ["preserve_order"] }
thiserror = "2.0.16"
glob = "0.3"
indicatif = "0.18"
inquire = "0.9"
schemars = "1"
serde_yaml_ng = "0.10"

[dev-dependencies]
tempfile = "3.6"
