[package]
name = "goat-hooker"
version = "0.1.0"
edition = "2024"

[lib]
name = "goat_hooker"
path = "src/lib.rs"

[[bin]]
name = "hooker"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
colored = "3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.143"
thiserror = "2.0.16"
glob = "0.3"
schemars = "1"

[dev-dependencies]
tempfile = "3.6"
