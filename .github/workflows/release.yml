name: Release

on:
  push:
    branches: [ "main" ]
  # Checks that the installers build (workflow artifacts, nothing is published)
  pull_request:
    branches: [ "main" ]
  # Rebuild the binaries and installers of an existing release
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of the release (e.g. v0.1.0)"
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Runs only for a commit `chore: release vX.Y.Z` on main: sets the version, writes the
  # CHANGELOG (from the conventional commits), publishes on crates.io and creates the tag +
  # the GitHub Release. Any other push releases nothing.
  release:
    name: Release
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore: release v')
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: read
    outputs:
      releases: ${{ steps.release-plz.outputs.releases }}
      releases_created: ${{ steps.release-plz.outputs.releases_created }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Install GUI dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libfontconfig-dev libx11-xcb-dev libxcb1-dev
      - name: Read the version of the commit
        id: version
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          subject="$(printf '%s\n' "$MESSAGE" | head -n1)"
          version="$(printf '%s\n' "$subject" | sed -nE 's/^chore: release v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?)( .*)?$/\1/p')"
          if [ -z "$version" ]; then
            echo "::error::Expected \"chore: release vX.Y.Z\", got \"$subject\""
            exit 1
          fi
          current="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "goat-hooker") | .version')"
          if [ "$version" != "$current" ] && [ "$(printf '%s\n%s\n' "$current" "$version" | sort -V | tail -n1)" != "$version" ]; then
            echo "::error::v$version is lower than the current version v$current"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
      - name: Install release-plz
        if: steps.version.outputs.version != steps.version.outputs.current
        uses: taiki-e/install-action@v2
        with:
          tool: release-plz
      - name: Set the version and write the changelog
        if: steps.version.outputs.version != steps.version.outputs.current
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Changelog of the commits since the last tag, then the version asked by the commit
          release-plz update
          release-plz set-version "$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: bump version to v$VERSION"
          git push origin HEAD:main
      - name: Run release-plz
        id: release-plz
        uses: release-plz/action@v0.5.148
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Binaries of the CLI and installers of the app, added to the GitHub Release
  assets:
    name: Assets (${{ matrix.target }})
    needs: release
    if: >-
      always() && (
        github.event_name != 'push' ||
        needs.release.outputs.releases_created == 'true'
      )
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            formats: deb,appimage
          - target: aarch64-apple-darwin
            os: macos-latest
            formats: dmg
          - target: x86_64-apple-darwin
            os: macos-latest
            formats: dmg
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            formats: nsis
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ inputs.tag || fromJSON(needs.release.outputs.releases || '[{}]')[0].tag }}
      # linuxdeploy (AppImage) without FUSE
      APPIMAGE_EXTRACT_AND_RUN: 1
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          # On a PR, the code of the PR; otherwise, the tag of the release
          ref: ${{ env.TAG || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libfontconfig-dev libx11-xcb-dev libxcb1-dev
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p goat-hooker -p goat-hooker-gui
      - name: Archive the CLI
        run: |
          set -e
          name="hooker-${TAG:-dev}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp README.md LICENSE "dist/$name/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/hooker.exe" "dist/$name/"
            (cd dist && 7z a "$name.zip" "$name" > /dev/null)
          else
            cp "target/${{ matrix.target }}/release/hooker" "dist/$name/"
            tar -czf "dist/$name.tar.gz" -C dist "$name"
          fi
          rm -rf "dist/$name"
      - name: Install cargo-packager
        run: cargo install cargo-packager --locked
      - name: Package the app
        run: cargo packager -p goat-hooker-gui --release --target ${{ matrix.target }} --formats ${{ matrix.formats }} --out-dir "$PWD/dist"
      - name: Upload as workflow artifacts
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: goat-hooker-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.dmg
            dist/*.exe
            dist/*.deb
            dist/*.AppImage
          if-no-files-found: error
      - name: Upload to the release
        if: github.event_name != 'pull_request'
        run: |
          set -e
          shopt -s nullglob
          files=(dist/*.tar.gz dist/*.zip dist/*.dmg dist/*.exe dist/*.deb dist/*.AppImage)
          ls -la "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --clobber

  # Formula (CLI) and cask (app) of the Homebrew tap zuygui/homebrew-tap.
  # Needs the HOMEBREW_TAP_TOKEN secret (a token allowed to push to the tap), skipped without it.
  homebrew:
    name: Homebrew
    needs: [release, assets]
    if: github.event_name != 'pull_request' && (github.event_name == 'workflow_dispatch' || needs.release.outputs.releases_created == 'true')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      TAG: ${{ inputs.tag || fromJSON(needs.release.outputs.releases || '[{}]')[0].tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Update the tap
        run: |
          set -euo pipefail
          if [ -z "$TAP_TOKEN" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN isn't set, the Homebrew tap isn't updated"
            exit 0
          fi
          mkdir dist
          gh release download "$TAG" --dir dist --pattern 'hooker-*.tar.gz' --pattern '*.dmg'
          sha() { sha256sum "dist/$1" | cut -d' ' -f1; }
          version="${TAG#v}"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/zuygui/homebrew-tap.git" tap
          mkdir -p tap/Formula tap/Casks
          ./packaging/homebrew.sh "$version" \
            "$(sha "hooker-$TAG-aarch64-apple-darwin.tar.gz")" \
            "$(sha "hooker-$TAG-x86_64-apple-darwin.tar.gz")" \
            "$(sha "hooker-$TAG-x86_64-unknown-linux-gnu.tar.gz")" \
            "$(sha "Goat.Hooker_${version}_aarch64.dmg")" \
            "$(sha "Goat.Hooker_${version}_x64.dmg")" \
            tap
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "goat-hooker $version" || exit 0
          git push
