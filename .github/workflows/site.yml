name: Site

# Builds the site (site/: the landing page and the docs of docs/) and publishes it on
# GitHub Pages: https://zuygui.github.io/goat-hooker/
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "benchmarks/results.json"
      - "CHANGELOG.md"
      - "Cargo.toml"
      - ".github/assets/*-dark.png"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - "docs/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the site
        uses: withastro/action@v6
        with:
          path: site

  deploy:
    # A pull request only checks that the site builds
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
