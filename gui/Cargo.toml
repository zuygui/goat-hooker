[package]
name = "goat-hooker-gui"
description = "Desktop app of Goat Hooker, an open-source Git hooks manager"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
# Distributed with the installers (dmg, msi, deb...), not on crates.io
publish = false

[[bin]]
name = "goat-hooker-gui"
path = "src/main.rs"

[dependencies]
goat-hooker = { path = "..", version = "0.4.0" }
gpui-kit = { version = "0.10", features = ["tree-sitter"] }
lsp-types = { version = "0.97", features = ["proposed"] }
anyhow = "1"
serde_json = "1"

[dev-dependencies]
tempfile = "3.6"

# Packaging of the app (cargo-packager): .app/.dmg, .exe (NSIS), .deb/.AppImage
# The binaries must be built first: `cargo build --release -p goat-hooker -p goat-hooker-gui`
[package.metadata.packager]
product-name = "Goat Hooker"
identifier = "com.zuygui.goat-hooker"
publisher = "Zuygui"
category = "DeveloperTool"
copyright = "Copyright © 2024 Zuygui"
license-file = "../LICENSE"
icons = [
    "packaging/32x32.png",
    "packaging/128x128.png",
    "packaging/128x128@2x.png",
    "packaging/icon@2x.png",
    "packaging/icon.ico",
]
# The app, and the `hooker` CLI next to it
binaries = [{ path = "goat-hooker-gui", main = true }, { path = "hooker" }]

[package.metadata.packager.macos]
minimum-system-version = "11.0"
# Ad hoc signature: without an Apple Developer account, macOS offers “Open Anyway”
# instead of saying that the app is damaged
signing-identity = "-"

[package.metadata.packager.nsis]
installer-icon = "packaging/icon.ico"
