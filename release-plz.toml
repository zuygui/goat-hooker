# Release automatique (https://release-plz.dev)
# On each push to main: a “chore: release” PR updates the version and the CHANGELOG
# (from the conventional commits). When it is merged: published on crates.io,
# tag `vX.Y.Z` and GitHub Release, then the binaries and installers are added to it.

[workspace]
# A single tag for the whole project (CLI + app)
git_tag_name = "v{{ version }}"
git_release_name = "Goat Hooker v{{ version }}"
changelog_path = "./CHANGELOG.md"
pr_labels = ["release"]
# In 0.x, a new feature (feat) bumps the minor version (0.1 → 0.2)
features_always_increment_minor = true

[[package]]
name = "goat-hooker-gui"
# Not on crates.io: the app is shipped with the installers of the release
publish = false
release = false
changelog_update = false

