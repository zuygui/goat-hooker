# Releases (https://release-plz.dev), only on demand: push a commit
# `chore: release vX.Y.Z` on main. The release workflow then sets the version, writes the
# CHANGELOG from the conventional commits, publishes on crates.io, creates the `vX.Y.Z` tag
# and the GitHub Release, and adds the binaries and installers to it.
# No release pull request is opened: other pushes release nothing.

[workspace]
# A single tag for the whole project (CLI + app)
git_tag_name = "v{{ version }}"
git_release_name = "Goat Hooker v{{ version }}"
changelog_path = "./CHANGELOG.md"
# The version comes from the release commit, not from the API changes
semver_check = false

[[package]]
name = "goat-hooker-gui"
# Not on crates.io: the app is shipped with the installers of the release
publish = false
release = false
changelog_update = false

